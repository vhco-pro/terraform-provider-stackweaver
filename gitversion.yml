# https://gitversion.net/docs/reference/configuration
workflow: GitHubFlow/v1
tag-prefix: 'v' # Terraform Registry requires v-prefixed tags (v0.1.0)
semantic-version-format: Loose
minor-version-bump-message: '^feat(\([^)]+\))?:\s'
patch-version-bump-message: '^(fix|perf|refactor|revert)(\([^)]+\))?:\s'
no-bump-message: '^(chore|docs|style|test|ci|build)(\([^)]+\))?:\s'
commit-message-incrementing: Enabled
branches:
  main:
    regex: ^master$|^main$
    increment: Patch
