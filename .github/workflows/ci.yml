name: CI
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "website/**"
      - "docs/**"
      - "spec/**"
      - "plan/**"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "website/**"
      - "docs/**"
      - "spec/**"
      - "plan/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Native client codecs (whole package) + our provider registration/alias tests.
      # Upstream TestAcc* need a live stack + TFE_TOKEN (they build a client before the
      # TF_ACC skip), so they run locally via dev_overrides, not in CI.
      - run: go test ./internal/stackweaver/ -count=1
      - run: go test ./internal/provider/ -run 'DualPrefix|KeptSurface' -count=1
