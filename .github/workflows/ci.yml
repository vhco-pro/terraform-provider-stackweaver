name: CI
on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "website/**"
      - "docs/**"
      - "spec/**"
      - "plan/**"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "website/**"
      - "docs/**"
      - "spec/**"
      - "plan/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Provider registration/alias + native client codecs. Acceptance (TestAcc*)
      # skips without TF_ACC — it needs a live Stackweaver stack, run via dev_overrides locally.
      - run: go test ./internal/provider/ ./internal/stackweaver/ -count=1
